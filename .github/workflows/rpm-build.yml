name: Build RPM Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing release tag to upload RPM assets to (example: v0.1.2)
        required: false
        type: string
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: rpm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rpm:
    name: ro-assist-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: fedora:43
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc-c++ \
            cmake \
            ninja-build \
            rpm-build \
            createrepo_c \
            desktop-file-utils \
            appstream \
            qt6-qtbase-devel \
            qt6-qttools-devel

      - name: Build package
        run: |
          cmake --preset ci
          cmake --build --preset ci
          ctest --preset ci
          desktop-file-validate packaging/linux/ro-assist.desktop
          appstreamcli validate packaging/linux/io.github.project_ro_asd.ro_assist.metainfo.xml
          cpack -G RPM --config build/ninja/CPackConfig.cmake

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: ro-assist-${{ matrix.arch }}
          path: build/ninja/packages/*.rpm
          if-no-files-found: error

  validate-rpm:
    name: validate-ro-assist-${{ matrix.arch }}
    needs: build-rpm
    runs-on: ${{ matrix.runner }}
    container: fedora:43
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install validation dependencies
        run: |
          dnf install -y \
            createrepo_c \
            rpm-build \
            qt6-qtbase

      - name: Download RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: ro-assist-${{ matrix.arch }}
          path: artifact-rpm

      - name: Validate Fedora 43 RPM install path
        run: |
          rpm_path="$(find artifact-rpm -maxdepth 1 -type f -name '*.rpm' | head -n 1)"
          test -n "$rpm_path"
          packaging/scripts/validate-fedora-rpm.sh "$rpm_path"

  publish-release:
    name: publish-release-assets
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: validate-rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download x64 RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: ro-assist-x64
          path: release-assets/x64

      - name: Download arm64 RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: ro-assist-arm64
          path: release-assets/arm64

      - name: Publish RPM assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_name="${GITHUB_REF_NAME}"
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            tag_name="${{ github.event.inputs.release_tag }}"
          fi

          if ! gh release view "$tag_name" >/dev/null 2>&1; then
            if git ls-remote --exit-code --tags "https://github.com/${GH_REPO}.git" "refs/tags/${tag_name}" >/dev/null 2>&1; then
              gh release create "$tag_name" \
                --title "$tag_name" \
                --generate-notes
            else
              echo "::error::Tag '${tag_name}' does not exist in ${GH_REPO}, so a release cannot be created."
              exit 1
            fi
          fi

          gh release upload "$tag_name" \
            release-assets/x64/*.rpm \
            release-assets/arm64/*.rpm \
            --clobber
