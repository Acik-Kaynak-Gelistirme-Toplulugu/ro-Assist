name: Build RPM Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: rpm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rpm:
    name: ro-assist-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: fedora:43
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc-c++ \
            cmake \
            ninja-build \
            rpm-build \
            createrepo_c \
            desktop-file-utils \
            appstream \
            qt6-qtbase-devel

      - name: Build package
        run: |
          cmake --preset ci
          cmake --build --preset ci
          ctest --preset ci
          desktop-file-validate packaging/linux/ro-assist.desktop
          appstreamcli validate packaging/linux/io.github.project_ro_asd.ro_assist.metainfo.xml
          cpack -G RPM --config build/ninja/CPackConfig.cmake

      - name: Validate Fedora 43 RPM install path
        run: packaging/scripts/validate-fedora-rpm.sh build/ninja/*.rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ro-assist-${{ matrix.arch }}
          path: build/ninja/*.rpm
          if-no-files-found: error
